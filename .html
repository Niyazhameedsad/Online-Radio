<!DOCTYPE html>

    <link rel="stylesheet" href="styles.css">
    <style>
        body { background-color: #f0f8ff; color: #333; font-family: Arial, sans-serif; }
        header { background-color: #4CAF50; color: white; padding: 10px 0; text-align: center; }
        nav ul { list-style-type: none; padding: 0; }
        nav ul li { display: inline; margin: 0 15px; }
        nav ul li a { text-decoration: none; color: #4CAF50; }
        footer { background-color: #4CAF50; color: white; text-align: center; padding: 10px 0; }
        .clearfix { clear: both; }
        .container { display: flex; justify-content: space-between; }
        .news, .radio { width: 48%; }
        .radio-section { display: none; } /* Initially hide the section */
        .toggle-button { cursor: pointer; background-color: #4CAF50; color: white; padding: 10px; border: none; margin-top: 10px; }
    </style>
    <script>
        function toggleRadio() {
            const radioSection = document.getElementById('radio-section');
            radioSection.style.display = radioSection.style.display === 'none' || radioSection.style.display === '' ? 'block' : 'none';
        }

        function playShakthiFM() {
            const currentTime = new Date();
            const hours = currentTime.getHours();
            const minutes = currentTime.getMinutes();

            // Check if the current time is 21: (9:05 PM)
            if (hours === 21 && minutes === 05) {
                const shakthiAudio = document.getElementById('shakthi-audio');
                shakthiAudio.play();
            }
        }

        

        function playSelectedStation() {
            const radios = document.getElementsByName('radio-station');
            let selectedStation = null;

            for (const radio of radios) {
                if (radio.checked) {
                    selectedStation = radio.value;
                    break;
                }
            }

            const audioElements = document.querySelectorAll('audio');
            audioElements.forEach(audio => {
                audio.pause(); // Pause all audio elements
            });

            if (selectedStation) {
                const selectedAudio = document.getElementById(selectedStation);
                selectedAudio.play(); // Play the selected audio
            }
        }
    </script>
</head>
